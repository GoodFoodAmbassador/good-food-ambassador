function startUpdate() {
  const pat = document.getElementById('pat').value.trim()
  if (!pat) { alert('Please paste your Airtable PAT first.'); return }
  document.getElementById('btn').disabled = true
  document.getElementById('setup').style.opacity = '0.4'
  document.getElementById('log').style.display = 'block'
  run(pat)
}

async function run(API_KEY) {
  const BASE_URL = `https://api.airtable.com/v0/${BASE_ID}/Products`
  const HEADERS  = { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' }

  async function fetchAllRecords() {
    const map = {}
    let offset = null
    do {
      const res  = await fetch(BASE_URL + `?fields[]=Name${offset ? `&offset=${offset}` : ''}`, { headers: HEADERS })
      const data = await res.json()
      if (data.error) throw new Error(data.error.message)
      for (const r of data.records) map[r.fields.Name] = r.id
      offset = data.offset
    } while (offset)
    return map
  }

  try {
    log('Fetching existing records…', 'dim')
    const idByName = await fetchAllRecords()
    log(`Found ${Object.keys(idByName).length} records.`, 'dim')

    const toUpdate = UPDATES.filter(u => idByName[u.Name])
    const missing  = UPDATES.filter(u => !idByName[u.Name]).map(u => u.Name)
    if (missing.length) log(`⚠ Not found (skipping): ${missing.join(', ')}`, 'dim')

    log(`Patching ${toUpdate.length} records…`, 'dim')

    for (let i = 0; i < toUpdate.length; i += 10) {
      const batch = toUpdate.slice(i, i + 10)
      const res = await fetch(BASE_URL, {
        method: 'PATCH',
        headers: HEADERS,
        body: JSON.stringify({
          records: batch.map(u => ({
            id: idByName[u.Name],
            fields: {
              PillarGood:  u.PillarGood,
              PillarClean: u.PillarClean,
              PillarFair:  u.PillarFair,
              PillarTrue:  u.PillarTrue,
            }
          }))
        })
      })
      const data = await res.json()
      if (data.error) throw new Error(data.error.message)
      for (const r of data.records) log(`✅  ${r.fields.Name}`, 'ok')
      if (i + 10 < toUpdate.length) await new Promise(r => setTimeout(r, 300))
    }

    log('', '')
    log('🎉 Done. All pillar text updated.', 'ok')
  } catch (e) {
    log('❌ Error: ' + e.message, 'err')
    document.getElementById('btn').disabled = false
  }
}
