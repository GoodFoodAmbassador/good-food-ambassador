function startImport() {
  const pat = document.getElementById('pat').value.trim()
  if (!pat) { alert('Please paste your Airtable PAT first.'); return }
  document.getElementById('btn').disabled = true
  document.getElementById('setup').style.opacity = '0.4'
  document.getElementById('log').style.display = 'block'
  run(pat)
}

async function run(API_KEY) {
  const URL     = `https://api.airtable.com/v0/${BASE_ID}/Products`
  const HEADERS = { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' }

  async function getExistingNames() {
    const names = new Set()
    let offset = null
    do {
      const res  = await fetch(URL + `?fields[]=Name${offset ? `&offset=${offset}` : ''}`, { headers: HEADERS })
      const data = await res.json()
      if (data.error) throw new Error(data.error.message)
      for (const r of data.records || []) names.add(r.fields.Name)
      offset = data.offset
    } while (offset)
    return names
  }

  async function createBatch(records) {
    const res  = await fetch(URL, {
      method: 'POST', headers: HEADERS,
      body: JSON.stringify({ records: records.map(f => ({ fields: f })) })
    })
    const data = await res.json()
    if (data.error) throw new Error(data.error.message)
    return data.records
  }

  try {
    log('Checking existing records…', 'dim')
    const existing = await getExistingNames()
    log(`Found ${existing.size} existing records.`, 'dim')

    const toCreate = PRODUCTS.filter(p => !existing.has(p.Name))
    const skipped  = PRODUCTS.length - toCreate.length
    if (skipped) log(`Skipping ${skipped} already-existing products.`, 'dim')

    if (toCreate.length === 0) {
      log('✅ All products already in Airtable — nothing to do.', 'ok')
      return
    }

    log(`Creating ${toCreate.length} pending records…`, 'dim')

    for (let i = 0; i < toCreate.length; i += 10) {
      const batch = toCreate.slice(i, i + 10)
      const created = await createBatch(batch)
      for (const r of created) log(`✅  ${r.fields.Name}`, 'ok')
      if (i + 10 < toCreate.length) await new Promise(r => setTimeout(r, 300))
    }

    log('', '')
    log('🎉 Done! Open Airtable to review, edit, and approve.', 'ok')
  } catch (e) {
    log('❌ Error: ' + e.message, 'err')
    document.getElementById('btn').disabled = false
  }
}
